<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASHBOARD SUMMARY PIC</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0;font-weight:800;line-height:1.1}
.small{color:#666;font-size:13px;margin-top:4px}
button{background:#000;color:#fff;border:0;border-radius:24px;padding:10px 18px;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid #eee;font-size:13px;text-align:left;white-space:nowrap}
th{background:#111;color:#fff;position:sticky;top:0}
.wrap{overflow:auto;max-height:80vh;background:#fff;border-radius:12px}
#status{font-size:12px;color:#0a0}
</style>
</head>
<body>
<div class="card">
<div>
<h1>DASHBOARD SUMMARY<br>PIC</h1>
<div class="small">Auto-sync dari STOK MASTER | Publikasi Web | Kolom L otomatis</div>
<div class="small">Last sync: <span id="last">-</span> <span id="status"></span></div>
</div>
<button onclick="loadData()">REFRESH</button>
</div>
<div class="wrap">
<table id="tbl"><thead></thead><tbody><tr><td>Loading data dari Google Sheet...</td></tr></tbody></table>
</div>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQcw_VWQ9-Z2JU87wyKKSruf5p6ZDZgfk3IDTFjtOp-r_NI0h9zcOjx8IQDy9c-UILUN5JmTm-ggKDi/pub?output=csv";
async function loadData(){
  document.getElementById('last').innerText = new Date().toLocaleString('id-ID');
  document.getElementById('status').innerText = " - Syncing...";
  try{
    const res = await fetch(CSV_URL + "&t=" + Date.now());
    const text = await res.text();
    const rows = text.split("\n").map(r=>{
      const cols = []; let cur=""; let inQ=false;
      for(let i=0;i<r.length;i++){
        const c=r[i];
        if(c=='"'){ if(inQ && r[i+1]=='"'){cur+='"'; i++;} else {inQ=!inQ;} }
        else if(c==',' &&!inQ){cols.push(cur); cur="";}
        else{cur+=c;}
      }
      cols.push(cur);
      return cols;
    });
    if(rows.length<2) throw new Error("CSV kosong");
    const head = rows[0];
    let thead = "<tr>" + head.map(h=>`<th>${h}</th>`).join("") + "</tr>";
    document.querySelector('#tbl thead').innerHTML = thead;
    let body = "";
    for(let i=1;i<rows.length;i++){
      if(rows[i].length<=1 || rows[i].join("").trim()=="") continue;
      body += "<tr>" + rows[i].map(c=>`<td>${c}</td>`).join("") + "</tr>";
    }
    document.querySelector('#tbl tbody').innerHTML = body || "<tr><td>Tidak ada data</td></tr>";
    document.getElementById('status').innerText = " - Berhasil " + (rows.length-1) + " baris";
  }catch(e){
    document.getElementById('status').innerText = " - Gagal: " + e.message;
    document.querySelector('#tbl tbody').innerHTML = `<tr><td>Gagal load: ${e.message}</td></tr>`;
  }
}
loadData();
</script>
</body>
</html>
