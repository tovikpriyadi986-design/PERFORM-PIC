<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard PIC - YOGYA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7] p-3 md:p-6">
<div class="max-w-7xl mx-auto">
  <div class="bg-white rounded-2xl p-5 shadow-sm mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-black">DASHBOARD SUMMARY PIC</h1>
      <p class="text-xs text-gray-500">Auto-sync dari STOK MASTER | Kolom L otomatis</p>
      <p id="lastUpdate" class="text-[11px] text-blue-600 mt-1 font-mono"></p>
    </div>
    <button onclick="loadData()" class="bg-black text-white px-4 py-2 rounded-full text-xs font-bold">REFRESH</button>
  </div>
  <div id="dashboard" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>
</div>
<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQcw_VWQ9-Z2JU87wyKKSruf5p6ZDZgfK3IDTFjtOp-r_NIOh9zcOjx8IQDy9c-UILUN5JmTm-ggKDi/pub?gid=0&single=true&output=csv";
async function loadData(){
  const res = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
  const text = await res.text();
  const lines = text.trim().split('\n');
  const parseRow = (row) => { const result=[]; let cur=''; let inQ=false; for(let i=0;i<row.length;i++){ const c=row[i]; if(c=='"'){ inQ=!inQ; continue; } if(c==',' &&!inQ){ result.push(cur.trim()); cur=''; } else { cur+=c; } } result.push(cur.trim()); return result; };
  const rows = lines.map(parseRow);
  const header = rows[0].map(h=>h.toLowerCase().trim());
  const findIdx = (keys) => header.findIndex(h=> keys.some(k=>h.includes(k)));
  const idxNode = findIdx(['node']); const idxSales = header.indexOf('sales'); const idxSalesTo = header.findIndex(h=> h.includes('sales to') &&!h.includes('ly')); const idxSalesToLy = header.findIndex(h=> h.includes('sales to') && h.includes('ly')); const idxPIC = findIdx(['pic']);
  const data = rows.slice(1).filter(r=> r[idxPIC]);
  const summary={};
  data.forEach(r=>{ let pic=(r[idxPIC]||'NO PIC').trim(); let node=(r[idxNode]||'UNKNOWN').trim(); let salesTo=parseFloat((r[idxSalesTo]||'0').replace(/[^0-9.-]/g,''))||0; let salesToLy=parseFloat((r[idxSalesToLy]||'0').replace(/[^0-9.-]/g,''))||0; let salesQty=parseFloat((r[idxSales]||'0').replace(/[^0-9.-]/g,''))||0; if(!summary[pic]) summary[pic]={ totalTo:0, nodes:{}, count:0, totalQty:0 }; if(!summary[pic].nodes[node]) summary[pic].nodes[node]={ to:0, toLy:0, qty:0, count:0, mati:0 }; summary[pic].totalTo+=salesTo; summary[pic].totalQty+=salesQty; summary[pic].count++; summary[pic].nodes[node].to+=salesTo; summary[pic].nodes[node].toLy+=salesToLy; summary[pic].nodes[node].qty+=salesQty; summary[pic].nodes[node].count++; if(salesTo===0) summary[pic].nodes[node].mati++; });
  const container=document.getElementById('dashboard'); container.innerHTML='';
  Object.keys(summary).sort().forEach(pic=>{ const s=summary[pic]; let nodesHtml=''; Object.keys(s.nodes).sort((a,b)=> s.nodes[b].to - s.nodes[a].to).forEach(node=>{ const n=s.nodes[node]; const kontribusi=s.totalTo? (n.to/s.totalTo*100):0; const growth=n.toLy? ((n.to-n.toLy)/n.toLy*100):0; nodesHtml+=`<tr class="border-b text-[12px]"><td class="py-2 px-3 font-bold">${node}</td><td class="py-2 px-3 text-right">Rp ${n.to.toLocaleString('id-ID')}</td><td class="py-2 px-3 text-center"><span class="bg-black text-white px-2 py-0.5 rounded-full text-[11px]">${kontribusi.toFixed(1)}%</span></td><td class="py-2 px-3 text-right ${growth>=0?'text-green-600':'text-red-600'}">${growth?growth.toFixed(1)+'%':'-'}</td><td class="py-2 px-3 text-center">${n.qty}</td><td class="py-2 px-3 text-center">${n.count} art | ${n.mati} mati</td></tr>`; }); container.innerHTML+=`<div class="bg-white rounded-2xl shadow-sm border overflow-hidden"><div class="p-4 flex justify-between items-center bg-gray-900 text-white"><h2 class="font-black">${pic.toUpperCase()}</h2><div class="font-bold text-sm">Rp ${s.totalTo.toLocaleString('id-ID')}</div></div><table class="w-full"><thead class="bg-gray-100 text-[10px]"><tr><th class="py-2 px-3 text-left">Node</th><th class="py-2 px-3 text-right">Sales Total (H)</th><th class="py-2">Kontribusi</th><th class="py-2">Growth</th><th>Qty</th><th>Detail</th></tr></thead><tbody>${nodesHtml}</tbody></table></div>`; });
  document.getElementById('lastUpdate').innerText='Last sync: '+new Date().toLocaleString('id-ID');
}
loadData(); setInterval(loadData,60000);
</script>
</body>
</html>
